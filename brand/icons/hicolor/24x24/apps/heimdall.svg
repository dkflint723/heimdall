<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <title>Heimdall</title>
  <!-- Two bands, not three. At this size a third would close the gaps and the
       whole thing would read as a solid triangle. -->
  <rect x="1" y="1" width="22" height="22" rx="5" fill="#16223A"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3">
    <path d="M 5 12 L 12 5 L 19 12" stroke="#E2574C"/>
    <path d="M 5 19 L 12 12 L 19 19" stroke="#E8A33D"/>
  </g>
</svg>
