<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Vaktari</title>
  <!-- One band and a hint of a second. Nobody perceives a spectrum at 16px, so
       the job here is only to stay recognisably the same mark. -->
  <rect x="0.5" y="0.5" width="15" height="15" rx="3.5" fill="#16223A"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
    <path d="M 4 8 L 8 4 L 12 8" stroke="#E8A33D"/>
    <path d="M 4 13 L 8 9 L 12 13" stroke="#4B93E6"/>
  </g>
</svg>
