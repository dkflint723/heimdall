<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect width="760" height="400" fill="#1e1e24"/>

  <text x="380" y="34" fill="#e8e8e8" font-size="17" font-weight="600" text-anchor="middle">
    Recent files, recent locations and the trash are not folders
  </text>
  <text x="380" y="56" fill="#8a8a92" font-size="12.5" text-anchor="middle">
    Three sources, one shape, and everything downstream is unchanged
  </text>

  <!-- sources -->
  <rect x="40" y="96" width="180" height="58" rx="9" fill="#2a2a33" stroke="#3a3a45"/>
  <text x="130" y="121" fill="#e8e8e8" font-size="13" text-anchor="middle">a real directory</text>
  <text x="130" y="140" fill="#7a7a86" font-size="11.5" text-anchor="middle">enumerate the filesystem</text>

  <rect x="40" y="166" width="180" height="58" rx="9" fill="#2a2a33" stroke="#3a3a45"/>
  <text x="130" y="191" fill="#e8e8e8" font-size="13" text-anchor="middle">recents.json</text>
  <text x="130" y="210" fill="#7a7a86" font-size="11.5" text-anchor="middle">what you opened, when</text>

  <rect x="40" y="236" width="180" height="58" rx="9" fill="#2a2a33" stroke="#3a3a45"/>
  <text x="130" y="261" fill="#e8e8e8" font-size="13" text-anchor="middle">the XDG trash</text>
  <text x="130" y="280" fill="#7a7a86" font-size="11.5" text-anchor="middle">payload + .trashinfo</text>

  <path d="M220 125 L288 176" stroke="#635bff" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M220 195 L288 195" stroke="#635bff" stroke-width="1.5" marker-end="url(#b)"/>
  <path d="M220 265 L288 214" stroke="#635bff" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- the single shape -->
  <rect x="296" y="152" width="188" height="86" rx="10" fill="#2a2a33" stroke="#635bff" stroke-width="1.6"/>
  <text x="390" y="180" fill="#e8e8e8" font-size="13" font-weight="600" text-anchor="middle">one signature</text>
  <text x="390" y="202" fill="#8f88ff" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">IAsyncEnumerable&lt;</text>
  <text x="390" y="218" fill="#8f88ff" font-size="11" text-anchor="middle" font-family="ui-monospace, monospace">IReadOnlyList&lt;FileEntry&gt;&gt;</text>

  <path d="M484 195 L544 195" stroke="#635bff" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- downstream -->
  <rect x="552" y="112" width="168" height="166" rx="10" fill="#2a2a33" stroke="#3a3a45"/>
  <text x="636" y="137" fill="#e8e8e8" font-size="13" font-weight="600" text-anchor="middle">unchanged</text>
  <text x="636" y="161" fill="#a8a8b2" font-size="12" text-anchor="middle">sorting</text>
  <text x="636" y="181" fill="#a8a8b2" font-size="12" text-anchor="middle">filtering</text>
  <text x="636" y="201" fill="#a8a8b2" font-size="12" text-anchor="middle">day grouping</text>
  <text x="636" y="221" fill="#a8a8b2" font-size="12" text-anchor="middle">all three layouts</text>
  <text x="636" y="241" fill="#a8a8b2" font-size="12" text-anchor="middle">selection</text>
  <text x="636" y="261" fill="#a8a8b2" font-size="12" text-anchor="middle">the status line</text>

  <text x="40" y="330" fill="#8a8a92" font-size="12">
    A virtual path such as vaktari:recent-files picks the source. Six places had to learn that a
  </text>
  <text x="40" y="350" fill="#8a8a92" font-size="12">
    path may not be on disk — the file watcher, the breadcrumb, the column strip, the tab title,
  </text>
  <text x="40" y="370" fill="#8a8a92" font-size="12">
    the visit recorder and the column set. Nothing else in the pane knows the difference.
  </text>

  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5"
            orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#635bff" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
</svg>
