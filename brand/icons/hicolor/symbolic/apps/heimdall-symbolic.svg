<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <title>Heimdall</title>
  <!-- Monochrome, for panels and trays. Uses the Breeze convention: a CSS class
       carrying the colour with fill="currentColor", which the desktop recolours
       to match its scheme.

       Worth noting this is exactly the pattern that defeated Heimdall's own SVG
       parser until it learned to read <style> blocks — a class-defined fill with
       no fill attribute on the element. -->
  <style type="text/css" id="current-color-scheme">
    .ColorScheme-Text { color: #232629; }
  </style>
  <g class="ColorScheme-Text" fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6">
    <path d="M 2.5 7.5 L 8 2 L 13.5 7.5"/>
    <path d="M 2.5 13.5 L 8 8 L 13.5 13.5"/>
  </g>
</svg>
