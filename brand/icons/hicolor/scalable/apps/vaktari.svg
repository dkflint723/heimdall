<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Vaktari</title>
  <!-- The Bifröst as three stacked spans. Strokes rather than a gradient, so
       every band keeps its own colour however far this is scaled down. Used
       from 32px upward; smaller sizes have their own drawings, because three
       bands here would each land on about one pixel at 16. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#16223A"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none"
        stroke="#3A4C70" stroke-width="6"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="36">
    <path d="M 120 268 L 256 132 L 392 268" stroke="#E2574C"/>
    <path d="M 120 348 L 256 212 L 392 348" stroke="#E8A33D"/>
    <path d="M 120 428 L 256 292 L 392 428" stroke="#5FBF7A"/>
  </g>
</svg>
