<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Heimdall</title>
  <!-- Redrawn on a 48 grid rather than scaled: coordinates land on whole
       pixels, so the strokes stay crisp instead of straddling boundaries. -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="10.5" fill="#16223A"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="10.5" fill="none"
        stroke="#3A4C70" stroke-width="1"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5">
    <path d="M 11 25 L 24 12 L 37 25" stroke="#E2574C"/>
    <path d="M 11 33 L 24 20 L 37 33" stroke="#E8A33D"/>
    <path d="M 11 41 L 24 28 L 37 41" stroke="#5FBF7A"/>
  </g>
</svg>
