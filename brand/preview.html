<!doctype html>
<meta charset="utf-8"><title>Vaktari — icon set</title>
<style>
  body{background:#101722;color:#cdd6e4;font:14px/1.5 system-ui,sans-serif;margin:0;padding:32px}
  h1{font-size:20px;margin:0 0 4px;color:#e9edf4} p{color:#8b97ab;margin:0 0 24px}
  .row{display:flex;gap:26px;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap}
  figure{margin:0;text-align:center} figcaption{margin-top:8px;color:#6f7b8f;font-size:12px}
  .light{background:#e9edf4;padding:20px;border-radius:12px;display:inline-block}
</style>
<h1>Vaktari — icon set</h1>
<p>Each size is drawn on its own grid, not scaled from one file.</p>
<div class="row">
  <figure><img src="icons/hicolor/scalable/apps/vaktari.svg" width="128"><figcaption>scalable @128</figcaption></figure>
  <figure><img src="icons/hicolor/scalable/apps/vaktari.svg" width="64"><figcaption>scalable @64</figcaption></figure>
  <figure><img src="icons/hicolor/48x48/apps/vaktari.svg" width="48"><figcaption>48×48</figcaption></figure>
  <figure><img src="icons/hicolor/24x24/apps/vaktari.svg" width="24"><figcaption>24×24</figcaption></figure>
  <figure><img src="icons/hicolor/16x16/apps/vaktari.svg" width="16"><figcaption>16×16</figcaption></figure>
</div>
<div class="row">
  <figure><span class="light"><img src="icons/hicolor/symbolic/apps/vaktari-symbolic.svg" width="24"></span><figcaption>symbolic on light</figcaption></figure>
  <figure><img src="icons/hicolor/symbolic/apps/vaktari-symbolic.svg" width="24"><figcaption>symbolic on dark</figcaption></figure>
</div>
